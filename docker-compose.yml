# version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-cycle-db
    environment:
      POSTGRES_DB: campus_cycle
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_cycle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  campus-network:
